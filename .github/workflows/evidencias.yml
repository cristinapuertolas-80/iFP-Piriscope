# Evidencias de funcionamiento (entrega NF3): levanta el producto desde cero en una máquina
# limpia con los datos reales de Hugging Face y guarda las pruebas como artefacto.
#
#   1. Instala el entorno fijado (environment/requirements-lock.txt).
#   2. Ejecuta los tests (informe JUnit).
#   3. Lista el contenido del dataset de Hugging Face y descarga la capa Gold.
#   4. Verifica las salidas reales de Gold con scripts/verificar_salidas.py.
#   5. Arranca el dashboard (Streamlit), comprueba que responde y captura cada vista.
#
# Secret necesario: HF_TOKEN (lectura sobre el dataset; el de la ingesta sirve).

name: Evidencias NF3

on:
  workflow_dispatch:
  push:
    branches: ["nf3/**"]

permissions:
  contents: read

env:
  HF_REPO_ID: ${{ vars.HF_REPO_ID || 'cpuertolas/piriscope' }}
  PYTHONUNBUFFERED: "1"

jobs:
  evidencias:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: environment/requirements*.txt

      - name: Instalar el entorno fijado
        run: |
          pip install -r environment/requirements-lock.txt
          mkdir -p evidencias
          { python --version; pip freeze; } > evidencias/entorno.txt

      - name: Tests
        run: |
          set -o pipefail
          pytest -o addopts="" -rs --junitxml=evidencias/pytest.xml 2>&1 | tee evidencias/pytest.txt

      - name: Contenido del dataset de Hugging Face
        run: |
          python - <<'PY' | tee evidencias/dataset_hf.txt
          import os, collections
          from huggingface_hub import HfApi
          api = HfApi(token=os.environ["HF_TOKEN"])
          repo = os.environ["HF_REPO_ID"]
          info = api.dataset_info(repo, files_metadata=True)
          print(f"Dataset: {repo} · revisión {info.sha} · última modificación {info.last_modified}")
          por_carpeta = collections.defaultdict(lambda: [0, 0])
          for s in info.siblings:
              partes = s.rfilename.split("/")
              clave = "/".join(partes[:2]) if partes[0] in ("raw", "data") else partes[0]
              por_carpeta[clave][0] += 1
              por_carpeta[clave][1] += s.size or 0
          for k in sorted(por_carpeta):
              n, b = por_carpeta[k]
              print(f"{k:<28} {n:>6} ficheros {b / 1e6:>10.1f} MB")
          print()
          for s in sorted(info.siblings, key=lambda s: s.rfilename):
              if s.rfilename.startswith(("data/gold/", "data/silver/", "models/")) or "/" not in s.rfilename:
                  print(f"{s.rfilename:<70} {(s.size or 0) / 1e6:>10.2f} MB")
          PY

      - name: Descargar la capa Gold (lo mismo que hace el dashboard al arrancar)
        run: |
          python - <<'PY' | tee evidencias/gold.txt
          import shutil
          from pathlib import Path
          import pandas as pd
          from src.dashboard import datos
          rutas = datos.descargar_gold_hf()
          Path("data/gold").mkdir(parents=True, exist_ok=True)
          for nombre, ruta in rutas.items():
              shutil.copy(ruta, Path("data/gold") / nombre)
          p = pd.read_parquet("data/gold/predicciones.parquet")
          e = pd.read_parquet("data/gold/explicaciones.parquet")
          p["fecha_objetivo"] = pd.to_datetime(p["fecha_objetivo"])
          print(f"predicciones.parquet: {len(p):,} filas · {p['id_municipio'].nunique()} municipios · "
                f"{p['fecha_objetivo'].min():%Y-%m-%d} a {p['fecha_objetivo'].max():%Y-%m-%d}")
          print("versiones:", p["version_modelo"].value_counts().to_dict())
          print(f"explicaciones.parquet: {len(e):,} filas · columnas {list(e.columns)}")
          ultima = p[p["fecha_objetivo"] == p["fecha_objetivo"].max()]
          print("niveles en la última fecha:", ultima["nivel_riesgo"].value_counts().to_dict())
          print("fecha_insert más reciente:", p["fecha_insert"].max())
          PY

      - name: Verificar las salidas reales de Gold
        run: |
          set -o pipefail
          python scripts/verificar_salidas.py --pred data/gold/predicciones.parquet \
            --expl data/gold/explicaciones.parquet 2>&1 | tee evidencias/verificar_salidas.txt

      - name: Arrancar el dashboard y comprobar que responde
        run: |
          nohup streamlit run src/dashboard/app.py --server.headless true --server.port 8501 \
            --browser.gatherUsageStats false > evidencias/streamlit.log 2>&1 &
          for i in $(seq 1 60); do
            curl -fsS http://localhost:8501/_stcore/health && break
            sleep 2
          done
          { date -u +"%Y-%m-%dT%H:%M:%SZ"; echo "GET /_stcore/health -> $(curl -fsS http://localhost:8501/_stcore/health)";
            curl -sS -o /dev/null -w "GET / -> HTTP %{http_code}\n" http://localhost:8501/; } | tee evidencias/health.txt

      - name: Capturas del dashboard
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
          python scripts/capturar_evidencias.py --url http://localhost:8501 --salida evidencias \
            --fecha 2025-08-14 --municipio 32054
          cp evidencias/streamlit.log evidencias/streamlit_tras_capturas.log

      - name: Guardar evidencias
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencias-nf3-${{ github.sha }}
          path: evidencias/
          retention-days: 90
