name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: environment/requirements*.txt
      # Versiones exactas (lockfile): el mismo entorno en local, en CI y en la entrega
      - run: pip install -r environment/requirements-lock.txt
      - run: pytest -o addopts="" -rs --junitxml=pytest-report.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pytest-report-${{ github.sha }}
          path: pytest-report.xml
          retention-days: 90
